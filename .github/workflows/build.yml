name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # NSGlassEffectView 需要 macOS 26 SDK 编译；macos-14 镜像 SDK 太旧
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 生成 Release 变更列表要读上一个 tag，浅克隆拿不到 tag 与历史
          fetch-depth: 0

      - name: Build & package .app
        run: |
          ./scripts/build-app.sh

      - name: Package .dmg
        run: |
          chmod +x scripts/package-dmg.sh
          ./scripts/package-dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppWindow-dmg
          path: dist/*.dmg

      # Release 正文的「本次变更」：上一个 tag 到本 tag 的提交主题。
      # 仓库没有 PR，generate_release_notes 抓不到内容，只能自己从提交生成。
      # continue-on-error：变更列表生成失败也不能挡住发版
      - name: Changelog
        id: changelog
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$previous" ]; then range="${previous}..HEAD"; else range="-n 20"; fi
          notes=$(git log ${range} --no-merges --invert-grep --grep='^chore(release)' --pretty='- %s')
          if [ -z "$notes" ]; then notes='- （本次无用户可见变更）'; fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
          body: |
            ## ⚠️ 首次打开说明（未公证应用）

            本应用未经 Apple 付费公证，从浏览器下载后 macOS 会提示
            **「无法验证"AppWindow.app"是否包含恶意软件」**。按任一方法放行一次即可，之后正常使用。
            （注意：macOS 15 / 26 上「右键 → 打开」已失效）

            - **图形界面**：拖进「应用程序」后双击 → 提示点「完成」→ 打开 **系统设置 → 隐私与安全性**，滑到底部点 **仍要打开**
            - **终端一行**：`xattr -dr com.apple.quarantine /Applications/AppWindow.app`

            首次运行还需在 **系统设置 → 隐私与安全性 → 辅助功能** 勾选 AppWindow。

            ## 本次变更

            ${{ steps.changelog.outputs.notes }}
