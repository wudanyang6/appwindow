name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # appcast.xml 由 CI 自己提交，不触发新构建（tag push 不受 path filter 影响）
    paths-ignore: ["appcast.xml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # NSGlassEffectView 需要 macOS 26 SDK 编译；macos-14 镜像 SDK 太旧
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 生成 Release 变更列表要读上一个 tag，浅克隆拿不到 tag 与历史
          fetch-depth: 0

      - name: Run tests
        run: swift test

      - name: Build & package .app
        run: |
          ./scripts/build-app.sh

      - name: Package .dmg
        run: |
          chmod +x scripts/package-dmg.sh
          ./scripts/package-dmg.sh

      # 以下发布步骤只在 tag 构建执行；push main 只跑测试 + 构建 + artifact
      - name: Verify tag matches bundle version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          # defaults read 不认相对路径，必须用绝对路径
          plist="$GITHUB_WORKSPACE/build/AppWindow.app/Contents/Info.plist"
          actual="$(defaults read "$plist" CFBundleShortVersionString)"
          build="$(defaults read "$plist" CFBundleVersion)"
          if [ "$actual" != "$expected" ]; then
            echo "错误：tag $GITHUB_REF_NAME 与构建产物版本 $actual 不一致（先改 scripts/build-app.sh 再打 tag）" >&2
            exit 1
          fi
          echo "VERSION=$actual" >> "$GITHUB_ENV"
          echo "BUILD=$build" >> "$GITHUB_ENV"
          echo "tag 与产物一致：$actual (build $build)"

      - name: Check build monotonicity
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 以远端 appcast 为准：tag 内副本可能落后（补打旧 tag 等场景），本地判断会失真
          remote_appcast="$RUNNER_TEMP/appcast-remote.xml"
          gh api "repos/wudanyang6/appwindow/contents/appcast.xml?ref=main" \
            -H "Accept: application/vnd.github.raw" > "$remote_appcast"
          ruby scripts/update-appcast.rb --check --version "$VERSION" --build "$BUILD" --appcast "$remote_appcast"

      - name: Verify signing secret
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "错误：仓库 secret SPARKLE_PRIVATE_KEY 未配置，无法签名 DMG" >&2
            exit 1
          fi

      - name: Sign DMG
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          dmg="dist/AppWindow-$VERSION.dmg"
          output="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | env -u SPARKLE_PRIVATE_KEY \
            .build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - "$dmg")"
          signature="$(printf '%s\n' "$output" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          length="$(printf '%s\n' "$output" | sed -n 's/.*length="\([0-9][0-9]*\)".*/\1/p')"
          if [ -z "$signature" ] || [ -z "$length" ]; then
            echo "错误：无法解析 sign_update 输出：$output" >&2
            exit 1
          fi
          echo "ED_SIGNATURE=$signature" >> "$GITHUB_ENV"
          echo "DMG_LENGTH=$length" >> "$GITHUB_ENV"
          echo "DMG 已签名：${dmg}（length=${length}）"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppWindow-dmg
          path: dist/*.dmg

      # Release 正文的「本次变更」：上一个 tag 到本 tag 的提交主题。
      # 仓库没有 PR，generate_release_notes 抓不到内容，只能自己从提交生成。
      # continue-on-error：变更列表生成失败也不能挡住发版
      - name: Changelog
        id: changelog
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$previous" ]; then range="${previous}..HEAD"; else range="-n 20"; fi
          notes=$(git log ${range} --no-merges --invert-grep --grep='^chore(release)' --pretty='- %s')
          if [ -z "$notes" ]; then notes='- （本次无用户可见变更）'; fi
          # 供 Update appcast 生成 release notes（本步骤失败时文件缺失，脚本有回退）
          printf '%s\n' "$notes" > "$GITHUB_WORKSPACE/changelog.md"
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
          body: |
            ## ⚠️ 首次打开说明（未公证应用）

            本应用未经 Apple 付费公证，从浏览器下载后 macOS 会提示
            **「无法验证"AppWindow.app"是否包含恶意软件」**。按任一方法放行一次即可，之后正常使用。
            （注意：macOS 15 / 26 上「右键 → 打开」已失效）

            - **图形界面**：拖进「应用程序」后双击 → 提示点「完成」→ 打开 **系统设置 → 隐私与安全性**，滑到底部点 **仍要打开**
            - **终端一行**：`xattr -dr com.apple.quarantine /Applications/AppWindow.app`

            首次运行还需在 **系统设置 → 隐私与安全性 → 辅助功能** 勾选 AppWindow。

            ## 本次变更

            ${{ steps.changelog.outputs.notes }}

      # appcast 更新放在 Release 之后：enclosure 指向的 DMG 必须先可下载。
      # 基线取远端内容而非 tag 内副本：本地副本可能落后，整体覆盖会丢已发布条目
      - name: Update appcast
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote_appcast="$RUNNER_TEMP/appcast-remote.xml"
          gh api "repos/wudanyang6/appwindow/contents/appcast.xml?ref=main" \
            -H "Accept: application/vnd.github.raw" > "$remote_appcast"
          ruby scripts/update-appcast.rb \
            --version "$VERSION" \
            --build "$BUILD" \
            --minimum-system-version 14.0 \
            --dmg-url "https://github.com/wudanyang6/appwindow/releases/download/$GITHUB_REF_NAME/AppWindow-$VERSION.dmg" \
            --ed-signature "$ED_SIGNATURE" \
            --length "$DMG_LENGTH" \
            --notes-file changelog.md \
            --appcast "$remote_appcast"
          bash scripts/publish-appcast.sh --appcast "$remote_appcast"
