name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # NSGlassEffectView 需要 macOS 26 SDK 编译；macos-14 镜像 SDK 太旧
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & package .app
        run: |
          ./scripts/build-app.sh

      - name: Package .dmg
        run: |
          chmod +x scripts/package-dmg.sh
          ./scripts/package-dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppWindow-dmg
          path: dist/*.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
